[package]
name = "ps-archive-manager"
version = "1.6.4"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
percent-encoding = "2"

[profile.release]
opt-level = "s"
strip = true
